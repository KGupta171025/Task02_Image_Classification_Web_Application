[project]
name = "task02-image-classification-web-app"
version = "1.0.0"
description = "Nexoramind Task 02 - Production Image Classification System with PyTorch, FastAPI, and Streamlit"
authors = [
    { name = "Krishna Gupta" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.32.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
